<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Balance Desk — Guildmaster</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
   <div class="bar-inner">
    <a class="brand" href="#/" id="brand">
      <span class="brand-name">The Balance Desk</span>
      <span class="brand-sub">balance workbench for Guildmaster</span>
    </a>

    <div class="spacer"></div>

    <div class="field">
      <label for="runA">Прогон</label>
      <select id="runA"></select>
    </div>
    <div class="field">
      <label for="runB">сравнить с</label>
      <select id="runB"></select>
    </div>
    <button class="ghost" id="settingsBtn">Настройки</button>
   </div>
  </header>

  <nav class="mainnav" id="mainnav"></nav>

  <div class="wrap">
    <nav class="crumbs" id="crumbs"></nav>
    <main id="view"></main>
    <footer id="foot"></footer>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card">
      <h2>Настройки</h2>
      <p class="hint" id="settingsStorage"></p>
      <div id="settingsList"></div>
      <div class="modal-actions">
        <button class="ghost" id="settingsClose">Готово</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
