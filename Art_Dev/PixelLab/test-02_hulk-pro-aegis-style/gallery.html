<style>
:root{ --bg:#f3f4f1; --panel:#ffffff; --ink:#1a1d24; --muted:#6a6f7a; --line:#e2e3de; --accent:#0f9e86; --keep:#0f9e86; --weak:#b5791a; --dup:#8a8f99; --stage:#8b9098; }
@media (prefers-color-scheme:dark){ :root{ --bg:#0f1116; --panel:#191c24; --ink:#e8eaef; --muted:#9298a4; --line:#262a34; --accent:#35c9b0; --keep:#35c9b0; --weak:#e0a63a; --dup:#7c828e; --stage:#767b84; } }
:root[data-theme="light"]{ --bg:#f3f4f1; --panel:#ffffff; --ink:#1a1d24; --muted:#6a6f7a; --line:#e2e3de; --accent:#0f9e86; --keep:#0f9e86; --weak:#b5791a; --dup:#8a8f99; --stage:#8b9098; }
:root[data-theme="dark"]{ --bg:#0f1116; --panel:#191c24; --ink:#e8eaef; --muted:#9298a4; --line:#262a34; --accent:#35c9b0; --keep:#35c9b0; --weak:#e0a63a; --dup:#7c828e; --stage:#767b84; }
*{box-sizing:border-box}
body{margin:0}
.wrap{background:var(--bg);color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;padding:28px 22px 40px;min-height:100vh}
header{max-width:1000px;margin:0 auto 26px}
header h1{font-size:20px;font-weight:600;margin:0 0 6px;letter-spacing:.02em}
header p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
header .tag{color:var(--accent)}
section{max-width:1000px;margin:0 auto 30px}
section h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
section h2.keep{color:var(--keep)} section h2.weak{color:var(--weak)} section h2.dup{color:var(--dup)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.card img{width:100%;max-width:170px;height:auto;image-rendering:pixelated;background:var(--stage);border-radius:8px}
figcaption{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.badge{font-size:12px;font-weight:600;padding:2px 10px;border-radius:20px;border:1px solid var(--line)}
.badge.keep{color:var(--keep)} .badge.weak{color:var(--weak)} .badge.dup{color:var(--dup)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.id{font-size:11px;color:var(--muted);opacity:.7;word-break:break-all}
</style>
