:root{--bg:#f4f5f2;--panel:#fff;--panel2:#f7f8f5;--ink:#1a1d24;--muted:#6a6f7a;--line:#e3e4df;--accent:#0f9e86;--keep:#0f9e86;--topdown:#0f9e86;--partial:#b5791a;--reject:#a8443a;--test:#2f6fb0;--stage:#8b9098}

:root[data-theme=light]{--bg:#f4f5f2;--panel:#fff;--panel2:#f7f8f5;--ink:#1a1d24;--muted:#6a6f7a;--line:#e3e4df;--accent:#0f9e86;--keep:#0f9e86;--topdown:#0f9e86;--partial:#b5791a;--reject:#a8443a;--test:#2f6fb0;--stage:#8b9098}
:root[data-theme=dark]{--bg:#0e1015;--panel:#181b22;--panel2:#1e222b;--ink:#e8eaef;--muted:#949aa6;--line:#272b34;--accent:#35c9b0;--keep:#35c9b0;--topdown:#35c9b0;--partial:#e0a63a;--reject:#e06a5c;--test:#6fb0e6;--stage:#767b84}
*{box-sizing:border-box}body{margin:0}
.wrap{background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;min-height:100vh;padding:26px 22px 48px}
.inner{max-width:1040px;margin:0 auto}
h1{font-size:19px;font-weight:600;margin:0 0 4px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px;line-height:1.6}
.gtitle{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,transform .1s;display:flex;flex-direction:column;gap:10px}
.vcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.vthumb{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:var(--stage);border-radius:10px}
.vtitle{font-size:13.5px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;border:1px solid var(--line);width:fit-content}
.badge.keep{color:var(--keep)}.badge.topdown{color:var(--topdown)}.badge.partial{color:var(--partial)}.badge.reject{color:var(--reject)}.badge.test{color:var(--test)}
.vmeta{font-size:12px;color:var(--muted);line-height:1.5}
.count{font-size:11px;color:var(--accent)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;padding:6px 14px;border-radius:20px;cursor:pointer;margin-bottom:18px}
.back:hover{border-color:var(--accent)}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.dhead h2{font-size:17px;font-weight:600;margin:0}
.prompt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--ink);margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px;margin-bottom:18px}
.kv dt{color:var(--muted)}.kv dd{margin:0;color:var(--ink);word-break:break-word}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.acard img{width:100%;max-width:170px;image-rendering:pixelated;background:var(--stage);border-radius:8px}
.alabel{font-size:12px;font-weight:600}
.adesc{font-size:11px;color:var(--muted);text-align:center;line-height:1.4}
.empty{color:var(--muted);font-size:13px;padding:20px 0}
</style>

const app=document.getElementById('app');
const GROUPS=[['topdown','Топ-даун — правильная проекция для игры'],['keep','Реалистичный (side) — с анимациями'],['test','Batch-тест промптов (side)'],['partial','Ранние заходы'],['reject','Забраковано']];
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function card(v){const i=VARIANTS.indexOf(v);return `<div class="vcard" onclick="detail(${i})">
    <img class="vthumb" src="${v.thumb||''}" alt="${esc(v.title)}"/>
    <span class="badge ${v.tone}">${esc(v.status.split(' —')[0].split(',')[0]).slice(0,24)}</span>
    <div class="vtitle">${esc(v.title)}</div>
    <div class="vmeta">${v.kind==='animations'?`<span class="count">${v.anims.length} анимаций</span>`:`${v.anims.length} поворотов`}</div>
  </div>`}
function home(){
  let html=`<h1>PixelLab — вариации Защитника</h1>
    <p class="sub">Наши заходы генерации. Клик по карточке — внутрь: промпт, параметры и все кадры/анимации (боковой вид east идёт в игру).</p>`;
  for(const [tone,label] of GROUPS){
    const vs=VARIANTS.filter(v=>v.tone===tone);
    if(!vs.length)continue;
    html+=`<div class="gtitle">${label}</div><div class="grid">${vs.map(card).join('')}</div>`;
  }
  app.innerHTML=html;window.scrollTo(0,0);
}
function detail(i){
  const v=VARIANTS[i];
  const params=Object.entries(v.params||{}).map(([k,val])=>`<dt>${esc(k)}</dt><dd>${esc(typeof val==='object'?JSON.stringify(val):val)}</dd>`).join('');
  const amap=v.animsmap||{};
  const anims=v.anims.length?v.anims.map(a=>{
    const key=a.label.split(' ')[0];
    const d=amap[key]?`<div class="adesc">${esc(typeof amap[key]==='object'?JSON.stringify(amap[key]):amap[key])}</div>`:'';
    return `<div class="acard"><img src="${a.src}" alt="${esc(a.label)}"/><div class="alabel">${esc(a.label)}</div>${d}</div>`;
  }).join(''):'<div class="empty">Нет кадров.</div>';
  app.innerHTML=`<button class="back" onclick="home()">&larr; ко всем вариациям</button>
    <div class="dhead"><h2>${esc(v.title)}</h2><span class="badge ${v.tone}">${esc(v.status)}</span></div>
    <div class="prompt">${esc(v.prompt)}</div>
    <dl class="kv">
      ${v.endpoint?`<dt>endpoint</dt><dd>${esc(v.endpoint)}</dd>`:''}
      ${v.reference?`<dt>стиль-реф</dt><dd>${esc(v.reference)}</dd>`:''}
      ${params}
      ${v.character_id?`<dt>character_id</dt><dd>${esc(v.character_id)}</dd>`:''}
      ${v.gens?`<dt>генераций</dt><dd>${esc(v.gens)}</dd>`:''}
      ${v.date?`<dt>дата</dt><dd>${esc(v.date)}</dd>`:''}
    </dl>
    <div class="agrid">${anims}</div>`;
  window.scrollTo(0,0);
}
home();
</script>
