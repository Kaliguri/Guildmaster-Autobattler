<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лаборатория · Guildmaster</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/shell.css">
</head>
<body>

  <!-- Три колонки: навигация — содержимое — оглавление страницы. Колонки объявлены разметкой, а
       не собираются в JS, чтобы сетка стояла до первой отрисовки и страница не прыгала. Наполняет
       их каркас: #lab-side и #lab-toc пусты ровно до boot(). -->
  <div class="lab-shell" id="lab-shell" data-toc="false">
    <aside class="lab-side" id="lab-side" aria-label="Разделы лаборатории"></aside>
    <div class="lab-main">
      <main id="lab-view"></main>
    </div>
    <aside class="lab-toc" id="lab-toc" aria-label="На этой странице"></aside>
  </div>

  <!-- Единственный тег скрипта на весь сайт: остальное каркас импортирует сам, а раздел
       подгружается по маршруту через import(). Файлы в dist/ собирает tsc из src/ —
       правишь TypeScript, а не это.  Сборка: npm run build (или npm run dev в фоне). -->
  <script type="module" src="dist/main.js"></script>

</body>
</html>
